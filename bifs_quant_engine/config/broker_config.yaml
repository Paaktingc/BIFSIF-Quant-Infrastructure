# Broker Configuration
# Mode: paper | live
broker:
  mode: paper
  
  # Paper trading configuration
  paper:
    initial_cash: 100000
    latency_ms: 50
    fill_probability: 1.0
    slippage_bps: 5
    commission_per_share: 0.005
    min_commission: 1.00
  
  # Live trading configuration (Alpaca)
  live:
    provider: alpaca
    # Use environment variables for secrets
    # ALPACA_API_KEY, ALPACA_API_SECRET
    base_url: https://paper-api.alpaca.markets

  # Polymarket CLOB configuration
  polymarket:
    host: https://clob.polymarket.com
    chain_id: 137
    signature_type: 0
    # Secrets via env: POLYMARKET_PRIVATE_KEY, POLYMARKET_FUNDER

  # Polymarket paper trading
  polymarket_paper:
    initial_cash: 10000
    taker_fee_bps: 0
    slippage_bps: 0
    fill_probability: 1.0

# Execution engine configuration
execution:
  max_retries: 3
  retry_delay_ms: 1000
  reconcile_interval_seconds: 60
